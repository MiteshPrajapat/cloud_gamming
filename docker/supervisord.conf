[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +extension RENDER -noreset
priority=10
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_err.log

[program:openbox]
command=openbox --sm-disable
environment=DISPLAY=":99"
priority=20
autorestart=true
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox_err.log

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -noxdamage -repeat -wait 50 -defer 50
priority=30
autorestart=true
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc_err.log

[program:websockify]
command=websockify --web /usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify_err.log

[program:backend]
directory=/app
command=/opt/venv/bin/uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
environment=DISPLAY=":99",LIBGL_ALWAYS_SOFTWARE="1",GALLIUM_DRIVER="llvmpipe",MESA_GL_VERSION_OVERRIDE="3.3"
priority=50
autorestart=true
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend_err.log
